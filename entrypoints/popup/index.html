<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Listen Cursor</title>
  </head>
  <body>
    <main>
      <header class="mast">
        <img src="/icons/leaf-cursor.svg" width="38" height="38" alt="" />
        <div>
          <p class="kicker">Browser extension</p>
          <h1>Code Listen Cursor</h1>
        </div>
      </header>

      <p id="status" class="status" role="status" aria-live="polite">
        Checking this page…
      </p>
      <div class="actions" aria-label="Listening controls">
        <button id="listen" class="primary" type="button">
          Listen now <kbd>⌥⇧S</kbd>
        </button>
        <button id="repeat" type="button">Repeat <kbd>⌥⇧R</kbd></button>
        <button id="follow" type="button" aria-pressed="false">
          Follow cursor <kbd>⌥⇧F</kbd>
        </button>
        <button id="stop" type="button">Stop <kbd>⌥⇧X</kbd></button>
      </div>

      <details>
        <summary>Reading settings</summary>
        <div class="settings">
          <label for="language">Code language</label>
          <select id="language">
            <option value="auto">Detect automatically</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="python">Python</option>
            <option value="rust">Rust</option>
            <option value="shell">Shell</option>
            <option value="other">Other</option>
          </select>

          <label for="punctuation">Punctuation detail</label>
          <select id="punctuation">
            <option value="essential">Essential structure</option>
            <option value="detailed">Detailed</option>
            <option value="literal">Every symbol</option>
          </select>

          <label for="voice">System voice</label>
          <select id="voice" aria-describedby="voice-note">
            <option value="">Automatic local voice</option>
          </select>
          <p class="voice-note" id="voice-note">
            Only voices marked local by your system are used.
          </p>

          <label for="rate"
            >Reading rate <output id="rate-value">0.9×</output></label
          >
          <input
            id="rate"
            type="range"
            min="0.5"
            max="1.5"
            step="0.1"
            value="0.9"
          />

          <label class="check"
            ><input id="indent" type="checkbox" checked /> Speak
            indentation</label
          >
          <label for="indent-size">Spaces per indent</label>
          <select id="indent-size">
            <option value="2">2 spaces</option>
            <option value="4">4 spaces</option>
          </select>
        </div>
      </details>

      <details>
        <summary>Personal pronunciation</summary>
        <form id="pronunciation-form" class="pronunciation-form">
          <label for="written">Code word</label
          ><input id="written" required autocomplete="off" />
          <label for="spoken">Speak as</label
          ><input id="spoken" required autocomplete="off" />
          <button type="submit">Add pronunciation</button>
        </form>
        <ul id="pronunciation-list" class="pronunciation-list"></ul>
      </details>
      <details>
        <summary>Move pronunciations</summary>
        <div class="transfer-controls">
          <button id="export-pronunciations" type="button">Export pronunciations</button>
          <label for="import-pronunciations">Import pronunciation file</label>
          <input id="import-pronunciations" type="file" accept="application/json,.json" />
          <p id="import-preview" class="transfer-status" role="status" aria-live="polite">
            Choose a pronunciation file to preview its entries.
          </p>
          <button id="apply-pronunciations" type="button" disabled>Apply imported pronunciations</button>
        </div>
      </details>
      <p class="privacy">Your code and preferences stay on this device.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
